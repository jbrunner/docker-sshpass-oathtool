version: 2
updates:
  # Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    assignees:
      - jbrunner
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: chore(deps)
      include: scope
    open-pull-requests-limit: 3

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    assignees:
      - jbrunner
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(deps)
      include: scope
    open-pull-requests-limit: 3

